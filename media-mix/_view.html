<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>백년밥상 미디어믹스</title>
<script src="/mm-gate.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --ink:#15171c; --ink2:#4b5060; --ink3:#8a8f9c; --line:#e4e6eb; --line2:#eef0f3;
  --head:#f6f7f9; --sub:#f1f2f5; --accent:#3b34c7; --accent-soft:#e7e6fb;
  --own:#d4652c; --own-soft:#fbeee6; --nav:#1d9a55; --nav-soft:#e3f4ea;
  --meta:#3f63e0; --shop:#1d9a55; --pl:#0f7f8c; --gfa:#8a5ad6; --brand:#c28a12;
  --warn-bg:#fff5de; --warn-ink:#8a5a00; --est-bg:#eef0f6; --est-ink:#4b5070;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111317; --card:#191c21; --ink:#eceef2; --ink2:#b3b8c4; --ink3:#7d8391; --line:#2a2e36; --line2:#23262d;
  --head:#1f2228; --sub:#1d2026; --accent:#8e88ff; --accent-soft:#2a2850;
  --own:#f08a52; --own-soft:#3a2518; --nav:#4cc783; --nav-soft:#183526;
  --meta:#7c98ff; --shop:#4cc783; --pl:#41b8c6; --gfa:#b08cf0; --brand:#e2b04a;
  --warn-bg:#3a2e12; --warn-ink:#f0c870; --est-bg:#262a36; --est-ink:#b8bdd6; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111317; --card:#191c21; --ink:#eceef2; --ink2:#b3b8c4; --ink3:#7d8391; --line:#2a2e36; --line2:#23262d;
  --head:#1f2228; --sub:#1d2026; --accent:#8e88ff; --accent-soft:#2a2850;
  --own:#f08a52; --own-soft:#3a2518; --nav:#4cc783; --nav-soft:#183526;
  --meta:#7c98ff; --shop:#4cc783; --pl:#41b8c6; --gfa:#b08cf0; --brand:#e2b04a;
  --warn-bg:#3a2e12; --warn-ink:#f0c870; --est-bg:#262a36; --est-ink:#b8bdd6; color-scheme:dark;}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px;display:flex;flex-direction:column;gap:28px}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
header.top h1{font-size:22px;margin:0;font-weight:700;text-wrap:balance}
header.top p{margin:4px 0 0;color:var(--ink2);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-h .n{background:var(--ink);color:var(--card);font:500 11px/1 "IBM Plex Mono",monospace;padding:5px 7px;border-radius:4px}
.sec-h h2{font-size:17px;margin:0;font-weight:700}
.sec-h .m{color:var(--ink3);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.kpi{padding:22px 22px 18px;display:flex;flex-direction:column;gap:18px}
.kpi-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.store{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.store i{width:10px;height:10px;border-radius:3px;display:inline-block}
.store small{font-weight:400;color:var(--ink3);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--ink2);padding:5px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg button:focus-visible,.inp:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hero{display:grid;grid-template-columns:1fr;gap:14px}
.hero .lbl{font-size:12px;color:var(--ink2)}
.big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.big small{font-size:15px;font-weight:600;margin-left:3px}
.hero .sub{font-size:12.5px;color:var(--ink2);margin-top:4px}
.bar{height:10px;background:var(--line2);border-radius:99px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
.barlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:6px}
.ratios{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ratio{background:var(--head);border-radius:10px;padding:10px 12px}
.ratio .k{font-size:11.5px;color:var(--ink2)}
.ratio .v{font-size:18px;font-weight:700}
.ratio .s{font-size:11px;color:var(--ink3)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 12px;border-top:1px solid var(--line);padding-top:14px}
.mt .k{font-size:11.5px;color:var(--ink2)}
.mt .v{font-size:17px;font-weight:700;white-space:nowrap}
.mt .s{font-size:11px;color:var(--ink3)}
.inp{font:inherit;font-size:12px;width:92px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--card);color:var(--ink)}
.tbl-card{padding:0;overflow:hidden}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1080px;font-size:12.8px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
th{background:var(--head);color:var(--ink2);font-weight:600;font-size:12px}
th.l,td.l{text-align:left}
td.store-c{font-weight:700;vertical-align:middle;border-right:1px solid var(--line2)}
td.ch-c{vertical-align:middle;border-right:1px solid var(--line2);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
tr.subtot td{background:var(--sub);font-weight:700}
tr.stot td{background:var(--head);font-weight:700;border-top:1px solid var(--line)}
tr.ref td{color:var(--ink3);font-size:12px}
tr.grand td{background:var(--head);font-weight:700;font-size:13.5px;border-top:2px solid var(--line)}
td .note{display:block;font-size:10.5px;color:var(--ink3);font-weight:400;white-space:normal;max-width:220px}
.pill{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:99px;background:var(--est-bg);color:var(--est-ink);font-weight:500;margin-left:4px;vertical-align:1px}
.roasv{font-weight:700;color:var(--accent)}
.foot{padding:14px 18px;border-top:1px solid var(--line);display:grid;gap:6px;font-size:12px;color:var(--ink2)}
.foot b{color:var(--ink)}
.checks{padding:18px 20px;display:grid;gap:10px}
.chk{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13px}
.chk .st{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn-ink);white-space:nowrap}
.chk .st.e{background:var(--est-bg);color:var(--est-ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:16px}
.cal .hd{font-size:11px;color:var(--ink3);text-align:center}
.day{border:1px solid var(--line2);border-radius:8px;padding:6px 7px;min-height:58px;display:flex;flex-direction:column;gap:2px}
.day.h{background:var(--warn-bg);border-color:transparent}
.day .d{font-size:11px;color:var(--ink3);display:flex;justify-content:space-between;gap:4px}
.day .hn{font-size:10px;color:var(--warn-ink)}
.day .a{font-size:11.5px;font-weight:600;color:var(--own)}
.day .b{font-size:11.5px;font-weight:600;color:var(--nav)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);padding:14px 16px 0}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .ratios{grid-template-columns:1fr 1fr 1fr}
  .big{font-size:30px}
  .cal{gap:3px;padding:10px}
  .day{padding:4px;min-height:52px}
  .day .a,.day .b{font-size:10px}
}
</style>
</head><body><style>
.wd{display:inline-flex;gap:2px}
.wd span{width:16px;height:16px;border-radius:4px;font-size:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--line2);color:var(--ink3)}
.wd span.on{background:var(--accent);color:var(--card)}
.sel{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card);color:var(--ink)}
.sel:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.small{font-size:12px;color:var(--ink3)}
.cond td{color:var(--ink3)}
.kpi .row2{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.kpi .exp{font-size:13px;color:var(--ink2)}
</style>
<div class="wrap">
  <header class="top">
    <div>
      <h1>백년밥상 미디어믹스</h1>
      <p>월별 목표 KPI, 매체별 예산, 캠페인 편성. 광고비 VAT 별도, 매출 VAT 포함 순매출, 원 단위.</p>
    </div>
    <label class="tag" for="month">월 선택 <select id="month" class="sel"></select></label>
  </header>
  <section>
    <div class="sec-h"><span class="n">01</span><h2 id="t1">목표 KPI</h2><span class="m" id="m1"></span></div>
    <div class="kpis" id="kpis"></div>
  </section>
  <section>
    <div class="sec-h"><span class="n">02</span><h2>매체별 예산 Summary</h2><span class="m">스토어 > 매체 | 기본, 프로모션, 조건부 분리</span></div>
    <div class="card tbl-card"><div class="tbl-wrap"><table id="summary" style="min-width:900px"></table></div></div>
  </section>
  <section>
    <div class="sec-h"><span class="n">03</span><h2>세부 미디어믹스</h2><span class="m">운영 일자, 주간 운영일, 캠페인별 역산 KPI</span></div>
    <div class="card tbl-card"><div class="tbl-wrap"><table id="mix" style="min-width:1400px"></table></div><div class="foot" id="foot"></div></div>
  </section>
</div>
<script>
const PLANS = {};
const CH_COLOR={meta_own:"var(--meta)",meta_cbt:"var(--meta)",naver_shopping:"var(--shop)",naver_powerlink:"var(--pl)",naver_gfa:"var(--gfa)",naver_brand:"var(--brand)"};
const STORE={naver:{label:"네이버 브랜드 스토어",short:"네이버",color:"var(--nav)"},own:{label:"카페24 자사몰",short:"자사몰",color:"var(--own)"}};
const won=v=>v==null||!isFinite(v)?"-":"₩"+Math.round(v).toLocaleString("ko-KR");
const n0=v=>v==null||!isFinite(v)?"-":Math.round(v).toLocaleString("ko-KR");
const n1=v=>v==null||!isFinite(v)?"-":(Math.round(v*10)/10).toLocaleString("ko-KR");
const pct=(v,d=2)=>v==null||!isFinite(v)?"-":(v*100).toFixed(d)+"%";
const eok=v=>(v/1e8).toFixed(2)+"억";
const man=v=>Math.round(v/1e4).toLocaleString("ko-KR");
const sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);
const sel=document.getElementById("month");
const API="/api/mm";
let MONTHS=[], cur=(location.pathname.match(/(\d{4}-\d{2})/)||[])[1]||null;
sel.addEventListener("change",()=>{location.href="/media-mix/"+sel.value;});

function active(P,st){return P.campaigns.filter(c=>c.store===st&&!c.conditional);}
function kpi(P,st){
  const cs=active(P,st),S=P.stores[st],B=sum(cs,"budget"),R=sum(cs,"target_revenue"),I=sum(cs,"target_impressions"),C=sum(cs,"target_clicks"),V=sum(cs,"target_conversions");
  const el=document.createElement("div");el.className="card kpi";
  el.innerHTML=`<div class="kpi-top"><span class="store"><i style="background:${STORE[st].color}"></i>${STORE[st].label}</span><span class="tag">${st==="naver"?"목표 확정":"목표 = 예상치 (추정)"}</span></div>
  <div class="row2"><div><div class="lbl" style="font-size:12px;color:var(--ink2)">목표 매출</div><div class="big num">${eok(S.target_sales)}</div></div>
  <div class="exp num">예상 ${eok(S.expected_sales)} (추정)<br>일평균 목표 ${won(S.target_sales/P.days.length)}</div></div>
  <div class="ratios"><div class="ratio"><div class="k">매출 ÷ 광고비 (MER)</div><div class="v num">${pct(S.target_sales/B,0)}</div></div>
  <div class="ratio"><div class="k">매체 귀속 목표 ROAS</div><div class="v num">${pct(R/B,0)}</div></div>
  <div class="ratio"><div class="k">광고비</div><div class="v num">${man(B)}만</div></div></div>
  <div class="metrics">
   <div class="mt"><div class="k">예산</div><div class="v num">${man(B)}만</div></div>
   <div class="mt"><div class="k">노출</div><div class="v num">${n0(I)}</div></div>
   <div class="mt"><div class="k">클릭</div><div class="v num">${n0(C)}</div></div>
   <div class="mt"><div class="k">전환</div><div class="v num">${n0(V)}건</div></div>
   <div class="mt"><div class="k">CPC</div><div class="v num">${won(B/C)}</div></div>
   <div class="mt"><div class="k">CTR</div><div class="v num">${pct(C/I)}</div></div>
   <div class="mt"><div class="k">CPA</div><div class="v num">${won(B/V)}</div></div></div>`;
  return el;
}
function summary(P){
  let h=`<thead><tr><th class="l">스토어</th><th class="l">매체</th><th>캠페인</th><th>기본</th><th>프로모션</th><th>합계</th><th>스토어 내 비중</th><th>목표 전환매출</th><th>목표 ROAS</th><th>조건부</th></tr></thead><tbody>`;
  let G={b:0,base:0,promo:0,rev:0,cond:0};
  ["naver","own"].forEach(st=>{
    const cs=P.campaigns.filter(c=>c.store===st),act=cs.filter(c=>!c.conditional),B=sum(act,"budget");
    const chs=[...new Set(cs.map(c=>c.channel))];
    chs.forEach((ch,i)=>{const a=act.filter(c=>c.channel===ch),cd=cs.filter(c=>c.channel===ch&&c.conditional);
      const b=sum(a,"budget"),rev=sum(a,"target_revenue"),cond=sum(cd,"budget");
      h+=`<tr>${i===0?`<td class="l store-c" rowspan="${chs.length+1}"><span class="dot" style="background:${STORE[st].color}"></span>${STORE[st].short}</td>`:""}<td class="l"><span class="dot" style="background:${CH_COLOR[ch]}"></span>${(a[0]||cd[0]).channel_label}</td><td class="num">${a.length}</td><td class="num">${man(sum(a,"budget_base"))}만</td><td class="num">${sum(a,"budget_promo")?man(sum(a,"budget_promo"))+"만":"-"}</td><td class="num"><b>${man(b)}만</b></td><td class="num">${pct(b/B,1)}</td><td class="num">${man(rev)}만</td><td class="num roasv">${pct(rev/b,0)}</td><td class="num">${cond?"+"+man(cond)+"만":"-"}</td></tr>`;});
    const rev=sum(act,"target_revenue"),cond=sum(cs.filter(c=>c.conditional),"budget");
    h+=`<tr class="stot"><td class="l">${STORE[st].short} 합계</td><td class="num">${act.length}</td><td class="num">${man(sum(act,"budget_base"))}만</td><td class="num">${man(sum(act,"budget_promo"))}만</td><td class="num">${man(B)}만</td><td class="num">100%</td><td class="num">${man(rev)}만</td><td class="num roasv">${pct(rev/B,0)}</td><td class="num">${cond?"+"+man(cond)+"만":"-"}</td></tr>`;
    G.b+=B;G.base+=sum(act,"budget_base");G.promo+=sum(act,"budget_promo");G.rev+=rev;G.cond+=cond;});
  h+=`<tr class="grand"><td class="l" colspan="3">총계 | 목표 매출 ${eok(P.stores.naver.target_sales+P.stores.own.target_sales)}</td><td class="num">${man(G.base)}만</td><td class="num">${man(G.promo)}만</td><td class="num">${man(G.b)}만</td><td></td><td class="num">${man(G.rev)}만</td><td class="num roasv">${pct(G.rev/G.b,0)}</td><td class="num">+${man(G.cond)}만</td></tr>`;
  document.getElementById("summary").innerHTML=h+"</tbody>";
}
function wdDots(w){return `<span class="wd">${["월","화","수","목","금","토","일"].map((d,i)=>`<span class="${w.includes(i)?"on":""}">${d}</span>`).join("")}</span>`;}
function dateLabel(c){const ds=c.schedule.dates;if(!ds.length)return"-";const f=x=>Number(x.slice(5,7))+"/"+Number(x.slice(8));return ds.length===1?f(ds[0]):f(ds[0])+"~"+f(ds[ds.length-1]);}
function mix(P){
  let h=`<thead><tr><th class="l">스토어</th><th class="l">매체</th><th class="l">캠페인</th><th class="l">운영 일자</th><th class="l">주간 운영일</th><th>운영일수</th><th>일예산</th><th>월 예산</th><th>비중</th><th>노출</th><th>클릭</th><th>전환</th><th>CPC</th><th>CTR</th><th>목표 CPA</th><th>목표 ROAS</th></tr></thead><tbody>`;
  ["naver","own"].forEach(st=>{
    const cs=P.campaigns.filter(c=>c.store===st),B=sum(cs.filter(c=>!c.conditional),"budget");
    const chs=[...new Set(cs.map(c=>c.channel))];let first=true;
    chs.forEach(ch=>{const g=cs.filter(c=>c.channel===ch);
      g.forEach((c,i)=>{
        const dayB=c.schedule.type==="daily_weighted"?"평균 "+n0(c.budget/c.schedule.days):n0(c.budget/c.schedule.days);
        const wk=c.schedule.weekdays.length?wdDots(c.schedule.weekdays):`<span class="small">${c.schedule.label}</span>`;
        h+=`<tr class="${c.conditional?"cond":""}">${first?`<td class="l store-c" rowspan="${cs.length}"><span class="dot" style="background:${STORE[st].color}"></span>${STORE[st].short}</td>`:""}${i===0?`<td class="l ch-c" rowspan="${g.length}"><span class="dot" style="background:${CH_COLOR[ch]}"></span>${c.channel_label}</td>`:""}
        <td class="l">${c.name}${c.replaced?'<span class="pill" style="background:var(--warn-bg);color:var(--warn-ink)">대체됨</span>':""}${c.conditional?'<span class="pill">조건부</span>':""}<span class="note">${c.note}</span></td><td class="l">${dateLabel(c)}<span class="note">${c.schedule.label}</span></td><td class="l">${wk}</td><td class="num">${c.schedule.days}일</td><td class="num">${dayB}</td><td class="num">${n0(c.budget)}</td><td class="num">${c.conditional?"-":pct(c.budget/B,1)}</td><td class="num">${n0(c.target_impressions)}</td><td class="num">${n0(c.target_clicks)}</td><td class="num">${n1(c.target_conversions)}</td><td class="num">${n0(c.budget/c.target_clicks)}</td><td class="num">${pct(c.target_clicks/c.target_impressions)}</td><td class="num">${n0(c.budget/c.target_conversions)}</td><td class="num roasv">${pct(c.target_roas,0)}</td></tr>`;first=false;});});
  });
  document.getElementById("mix").innerHTML=h+"</tbody>";
  document.getElementById("foot").innerHTML=`<div><b>일예산</b> 월 예산 ÷ 운영일수. 검색광고는 요일 지수로 가중 배분하므로 평균값입니다. 조건부 캠페인은 비중과 합계에서 제외.</div><div><b>목표 ROAS</b> 9월 실측 기반 역산값 (추정 포함). 산정 근거는 월간 리포트에 있습니다. plan ${P.version}, 확정 ${P.approved}.</div>`;
}
function render(){
  const P=PLANS[cur];const mo=Number(cur.slice(5));
  document.getElementById("t1").textContent=`목표 KPI (${mo}월)`;
  document.getElementById("m1").textContent=`${P.days.length}일 | 휴일 ${P.days.filter(d=>d.holiday).map(d=>Number(d.date.slice(8))).join(", ")}일 | 프로모션 ${P.promotions.map(p=>p.name).join(", ")}`;
  const k=document.getElementById("kpis");k.innerHTML="";k.appendChild(kpi(P,"naver"));k.appendChild(kpi(P,"own"));
  summary(P);mix(P);
}
async function init(){
  try{MONTHS=(((await fetch(API+"/months").then(r=>r.json()))||{}).months||[]).slice();}catch(e){MONTHS=[];}
  if(cur&&!MONTHS.includes(cur))MONTHS.unshift(cur);
  MONTHS=[...new Set(MONTHS)].sort().reverse(); if(!cur)cur=MONTHS[0];
  sel.innerHTML=""; MONTHS.forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=k.replace("-","년 ")+"월";sel.appendChild(o);}); if(cur)sel.value=cur;
  if(!cur){document.querySelector(".wrap").insertAdjacentHTML("afterbegin",'<div class="tag">등록된 월이 없습니다. 시드 적재 후 새로고침하세요.</div>');return;}
  let pr; try{pr=await fetch(API+"/plan?month="+encodeURIComponent(cur)).then(r=>r.json());}catch(e){}
  if(pr&&pr.payload){PLANS[cur]=pr.payload; render();}
  else {document.getElementById("kpis").innerHTML='<div class="card kpi" style="padding:22px">plan 없음: '+cur+'</div>';}
}
init();
</script>
