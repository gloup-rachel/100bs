<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>백년밥상 미디어 믹스 · 2026년 10월</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/preset-system.css">
<style>
  .mm{max-width:var(--maxw);margin:0 auto;padding:1.2rem var(--gutter) 4rem}
  .top{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;margin:.2rem 0 1.1rem}
  .top .back{display:inline-flex;width:32px;height:32px;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text-secondary);text-decoration:none}
  .top .back:hover{background:var(--bg-subtle)}
  .top h1{font-size:1.15rem;font-weight:800;letter-spacing:-.02em;margin:0}
  .top .mo{font-size:.95rem;font-weight:700;color:var(--text-secondary)}
  .top .sp{flex:1}
  .top .chip{font-size:.72rem;font-weight:600;color:var(--text-muted);background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--r-pill);padding:.28rem .6rem}
  .pills{display:flex;gap:6px;margin-bottom:1.1rem}
  .pill{font:inherit;font-size:.8rem;font-weight:700;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:var(--r-pill);padding:.36rem .85rem;cursor:pointer;text-decoration:none}
  .pill.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
  .pill.off{opacity:.5;cursor:not-allowed}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.6rem}
  .tile{border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);padding:.85rem .95rem}
  .tile .l{font-size:.74rem;color:var(--text-muted)}
  .tile .v{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums;margin-top:.15rem;letter-spacing:-.01em}
  .tile .s{font-size:.74rem;color:var(--text-secondary);margin-top:.2rem}
  .sec{margin-top:1.8rem}
  .sech{display:flex;align-items:center;gap:.55rem;margin-bottom:.9rem}
  .sech .n{font-size:.72rem;font-weight:800;color:var(--brand);background:var(--brand-soft);border-radius:var(--r-sm);padding:.15rem .45rem;font-variant-numeric:tabular-nums}
  .sech h2{font-size:1.02rem;font-weight:800;margin:0}
  .card{border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);padding:1.1rem 1.2rem}
  /* 스택바 */
  .bars{display:flex;flex-direction:column;gap:9px}
  .barrow{display:flex;align-items:center;gap:.7rem}
  .barrow .dw{width:20px;font-size:.8rem;font-weight:700;color:var(--text-secondary);text-align:center;flex:0 0 auto}
  .bartrack{flex:1;min-width:0}
  .bar{display:flex;height:26px;border-radius:6px;overflow:hidden;background:transparent}
  .seg{height:100%}
  .barrow .tot{width:52px;text-align:right;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .legend{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:1rem;padding-top:.9rem;border-top:1px solid var(--border)}
  .lg{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--text-secondary)}
  .lg i{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .lg b{color:var(--text);font-variant-numeric:tabular-nums}
  /* 표 */
  .tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-md)}
  table.mx{width:100%;border-collapse:collapse;font-size:.82rem;min-width:720px}
  table.mx th{font-size:.7rem;color:var(--text-muted);font-weight:600;padding:.55rem .6rem;border-bottom:1px solid var(--border);white-space:nowrap;text-align:right;background:var(--bg-subtle)}
  table.mx th.l,table.mx td.l{text-align:left}
  table.mx td{padding:.5rem .6rem;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.mx td .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:.4rem;vertical-align:-1px}
  table.mx tr.sub td{background:var(--bg-subtle);font-weight:700}
  table.mx tr.tot td{border-top:2px solid var(--border-strong);font-weight:800}
  table.mx td.mut{color:var(--text-faint)}
  .foot{font-size:.74rem;color:var(--text-muted);line-height:1.7;margin-top:1.6rem;padding-top:1rem;border-top:1px solid var(--border)}
  .foot b{color:var(--text-secondary)}
  @media(max-width:1039px){.tiles{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:767px){.tiles{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="mm">
  <div class="top">
    <a class="back" href="/" title="허브로"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <h1>백년밥상 미디어 믹스</h1>
    <span class="mo" id="moLabel">2026년 10월</span>
    <span class="sp"></span>
    <span class="chip" id="genChip">갱신 -</span>
    <span class="chip">VAT 별도</span>
    <span class="chip" id="srcChip">라플라스 6651 · 백년밥상_RAW</span>
  </div>

  <div class="pills">
    <span class="pill off" title="데이터 없음">8월</span>
    <span class="pill off" title="데이터 없음">9월</span>
    <span class="pill on">10월</span>
    <a class="pill" href="/media-mix/2026-10/daily" style="margin-left:auto">데일리 KPI →</a>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="sec">
    <div class="sech"><span class="n">01</span><h2>요일별 광고비 구성</h2></div>
    <div class="card">
      <div class="bars" id="bars"></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="sec">
    <div class="sech"><span class="n">02</span><h2>채널 × 요일 편성표</h2></div>
    <div class="tblwrap"><table class="mx" id="grid"></table></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const won=n=>{n=Math.round(n); return n>=10000?(n/10000).toFixed(2)+'억':n.toLocaleString()+'만';};
const manNum=n=>Math.round(n).toLocaleString();
const sum=a=>a.reduce((x,y)=>x+y,0);

fetch('/media-mix/2026-10/data.json').then(r=>r.json()).then(D=>{
  const {dow,mix,goal,total,group,gorder,generated_at}=D;
  const channels=Object.keys(mix);
  const wkTotal=sum(total);                       // 주간 총 광고비
  const wkGoal=sum(goal);                         // 주간 매출 목표
  const days=new Date(2026,10,0).getDate();       // 31
  const seriesVar=g=>`var(--series-${gorder.indexOf(g)+1})`;
  // 그룹별 요일값 / 주간합
  const gval={}; gorder.forEach(g=>gval[g]=dow.map((_,i)=>sum(channels.filter(c=>group[c]===g).map(c=>mix[c][i]))));
  const gWeek={}; gorder.forEach(g=>gWeek[g]=sum(gval[g]));

  // 갱신칩
  const gt=new Date(generated_at); const p=x=>String(x).padStart(2,'0');
  $('genChip').textContent=`갱신 ${p(gt.getMonth()+1)}-${p(gt.getDate())} ${p(gt.getHours())}:${p(gt.getMinutes())}`;

  // 스탯 타일 4
  $('tiles').innerHTML=[
    ['주간 총 광고비',won(wkTotal),`일평균 ${won(wkTotal/7)}`],
    ['주간 매출 목표',won(wkGoal),`일평균 ${won(wkGoal/7)}`],
    ['목표 ROAS',(wkGoal/wkTotal*100).toFixed(0)+'%','고정비 포함 기준'],
    ['월 환산 광고비',won(Math.floor(wkTotal/7*days)),`${days}일 기준`],
  ].map(([l,v,s])=>`<div class="tile"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');

  // 01 스택바
  const maxTot=Math.max(...total);
  $('bars').innerHTML=dow.map((d,i)=>{
    const segs=gorder.map(g=>{const val=gval[g][i]; if(!val)return ''; return `<div class="seg" style="width:${(val/total[i]*100).toFixed(2)}%;background:${seriesVar(g)}" title="${g} ${val}만"></div>`;}).join('');
    return `<div class="barrow"><span class="dw">${d}</span><div class="bartrack"><div class="bar" style="width:${(total[i]/maxTot*100).toFixed(2)}%;gap:2px">${segs}</div></div><span class="tot">${total[i]}만</span></div>`;
  }).join('');
  $('legend').innerHTML=gorder.map(g=>`<span class="lg"><i style="background:${seriesVar(g)}"></i>${g} <b>${gWeek[g]}만</b></span>`).join('');

  // 02 편성표
  const th=`<thead><tr><th class="l">채널</th>${dow.map(d=>`<th>${d}</th>`).join('')}<th>주간</th><th>비중</th></tr></thead>`;
  let rows=channels.map(c=>{
    const wk=sum(mix[c]);
    const tds=mix[c].map(v=>v?`<td>${v}</td>`:`<td class="mut">-</td>`).join('');
    return `<tr><td class="l"><span class="sw" style="background:${seriesVar(group[c])}"></span>${c}</td>${tds}<td>${wk}</td><td>${(wk/wkTotal*100).toFixed(1)}%</td></tr>`;
  }).join('');
  const totRow=`<tr class="sub"><td class="l">총 광고비</td>${total.map(v=>`<td>${v}</td>`).join('')}<td>${wkTotal}</td><td>100%</td></tr>`;
  const goalRow=`<tr><td class="l">매출 목표</td>${goal.map(v=>`<td>${manNum(v)}</td>`).join('')}<td>${manNum(wkGoal)}</td><td class="mut">-</td></tr>`;
  const roasRow=`<tr class="tot"><td class="l">목표 ROAS</td>${dow.map((_,i)=>`<td>${(goal[i]/total[i]*100).toFixed(0)}%</td>`).join('')}<td>${(wkGoal/wkTotal*100).toFixed(0)}%</td><td class="mut">-</td></tr>`;
  $('grid').innerHTML=th+`<tbody>${rows}${totRow}${goalRow}${roasRow}</tbody>`;

  const sc=Object.values(D.weekday_index.CAFE_24).reduce((a,b)=>a+b,0);
  $('foot').innerHTML=`<b>주석</b> · 단위 만원(VAT 별도) · 매출 목표/실적은 구매완료 기준 · 요일 지수는 청정 2주(2026-09-07~09-19) 주문건수 기준, 연휴 종료 후 재산출 필요 · ΣCAFE_24=${sc.toFixed(3)} (재배분값은 이 합으로 정규화) · 데이터 출처 라플라스(6651) + 백년밥상_RAW 시트`;
}).catch(e=>{ $('tiles').innerHTML=`<div class="tile" style="grid-column:1/-1;color:var(--danger)">데이터를 불러오지 못했습니다. (${e.message})</div>`; });
</script>
</body>
</html>
