<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>백년밥상 AI 시스템</title>
  <meta name="description" content="백년밥상 마케팅 자동화 시스템">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="preset-system.css">
  <style>
    /* 하위 카테고리(서브 모듈) — 카드 안에 목록으로 렌더 */
    .ps-subs{display:flex;flex-direction:column;gap:.35rem;margin:.75rem 0 .25rem}
    .ps-sub{display:flex;align-items:flex-start;gap:.6rem;padding:.55rem .65rem;border-radius:.6rem;
      border:1px solid rgba(128,128,128,.18);background:rgba(128,128,128,.05);text-align:left}
    .ps-sub.is-live{cursor:pointer}
    .ps-sub.is-live:hover{border-color:currentColor;opacity:.92}
    .ps-sub.is-soon{opacity:.55}
    .ps-sub svg{width:16px;height:16px;flex:0 0 auto;margin-top:.15rem}
    .ps-sub-txt{flex:1 1 auto;min-width:0}
    .ps-sub-title{font-size:.82rem;font-weight:600;line-height:1.3}
    .ps-sub-desc{font-size:.72rem;opacity:.65;line-height:1.35;margin-top:.1rem}
    .ps-sub-tag{font-size:.65rem;opacity:.6;flex:0 0 auto;margin-top:.2rem}
    .ps-nav-item.sub{padding-left:2.1rem;font-size:.8rem;opacity:.85}
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════
     프리셋 AI 시스템 허브 — 화면 전체가 아래 SYSTEM config로 렌더됩니다.
     신규 클라이언트용으로 복제할 때는 SYSTEM 객체만 교체하세요.
     ══════════════════════════════════════════════════════════════ -->

<div id="app"></div>

<script>
/* ───────────────────────────────────────────────────────────────
   [1] 아이콘 세트 — 얇은 라인 스트로크(단색). 이모지 사용 안 함.
   ─────────────────────────────────────────────────────────────── */
const ICON = {
  bowl:      '<path d="M3 11h18M4 11a8 8 0 0 0 16 0M8 11V7a1 1 0 0 1 1-1M12 11V5M16 11V7a1 1 0 0 0-1-1"/>',
  message:   '<path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>',

  activity:  '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  sparkle:   '<path d="M12 3v4m0 10v4M5 12H1m22 0h-4M6.3 6.3 4 4m16 16-2.3-2.3M6.3 17.7 4 20M20 4l-2.3 2.3"/><circle cx="12" cy="12" r="3.2"/>',
  arrow:     '<path d="M5 12h14M13 6l6 6-6 6"/>',
  lock:      '<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  search:    '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  doc:       '<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 3h9l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>',
  package:   '<path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
  list:      '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  home:      '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
};
function svg(name, cls) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
    ${cls ? `class="${cls}"` : ''}>${ICON[name] || ''}</svg>`;
}

/* ───────────────────────────────────────────────────────────────
   [2] SYSTEM CONFIG — 이 블록만 클라이언트에 맞게 교체
       · brand.title : 시스템 이름
       · maker       : 제작사 표기 (아주 작게)
       · modules     : 상태 'live'가 자동으로 위로, 'soon'은 자동 하단
       · knowledge   : 검색되는 자료(KB) 목록. 채우면 검색창에 노출됨
   ─────────────────────────────────────────────────────────────── */
const SYSTEM = {
  brand: {
    mark: 'bowl',
    title: '백년밥상 AI 시스템',

  },
  // 카테고리 필터 — 항목(모듈/KB)이 1개 이상 있는 카테고리만 칩으로 노출됨.
  // 순서·라벨은 여기서 조정. KB는 knowledge 배열이 채워지면 자동 표시.
  categories: [
    { key: 'dashboard',   label: '대시보드' },
    { key: 'performance', label: '퍼포먼스' },
    { key: 'content',     label: '콘텐츠' },
    { key: 'admin',       label: '어드민' },
    { key: 'kb',          label: 'KB' },
  ],
  modules: [
    {

      features: ['목표 KPI', '매체별 예산', '세부 편성표', '요일 배분'],

    },

      features: ['달성률·페이스', '일자별 캘린더', '매체별 달성률', '미매핑 경고'],

      desc: '월간 운영 리포트를 봅니다. 미디어믹스 근거와 프로모션 운영안, ROAS 산정 배경을 정리해요.',
      features: ['월간 리포트', 'ROAS 근거', '프로모션 운영안'],
      status: 'live',
      href: '/report',
    },
    {

      title: '광고 매핑 체크',

      features: ['ROAS 예측', '예산 최적화', '손익 시뮬레이션', '목표 역산'],

    },
    {
      icon: 'package',
      title: '품절·재입고 트래커',

      features: ['품절 현황', '재입고 예정', '편성 알림', '채널별 관리'],
      status: 'live',
      href: 'https://100bs-tracker.vercel.app/',
      external: true,
    },
    {
      icon: 'activity',
      title: '애드워치 · 광고 이상감지',

      desc: '채널별 광고 성과를 룰로 판정해 이상 캠페인을 매일 잡아냅니다. 조치 카드로 캠페인 복사·콘솔 이동·조치 완료까지 한 번에 처리해요.',
      features: ['룰 기반 이상감지', '채널별 조치 카드', '조치율 관리', '콘솔 바로가기'],

    },
    {

      desc: '소재별 성과를 분석해 전환을 만드는 비주얼과 카피를 찾습니다. 다음 소재 방향도 제안해요.',
      features: ['소재 성과 분석', '카피 패턴', '크리에이티브 제안', 'A/B 인사이트'],
      status: 'soon',
    },
    {
      icon: 'message',
      title: 'CRM 자동화 시스템',
      cat: 'admin',

      features: ['소구점 라이브러리', '상품 데이터 허브', '편성과 발송 결과'],
      status: 'live',
      // 하위 카테고리 — 여기에 추가하면 카드와 사이드바에 자동으로 붙습니다
      subs: [
        {
          icon: 'search',
          title: '소구점 라이브러리',
          desc: '상품 번호나 이름으로 소구점, 구성, 금지 사항을 찾습니다',
          status: 'live',
          href: '/products',
        },
        {
          icon: 'list',
          title: 'CRM 데이터 허브',
          desc: '상품마스터, 이슈보드, 편성 캘린더, 발송로그',
          status: 'live',
          href: 'https://docs.google.com/spreadsheets/d/13Oq-y8Myhe11K33TUqHwp4T0eXkLw8kAA1UpluzGrdA/edit',
          external: true,
        },
        {
          icon: 'sparkle',
          title: '편성 추천',
          desc: '성과와 재고를 보고 다음 발송 상품을 제안합니다',
          status: 'soon',
        },
        {
          icon: 'trending',
          title: '발송 결과 분석',
          desc: 'CTR, 클릭당 구매, 1천건당 매출 추이',
          status: 'soon',
        },
      ],
    },
  ],
  // 검색되는 자료(KB). 채우면 KB 카테고리 칩과 검색 결과에 자동 노출됨.
  // 예: { title:'CRM 게이트 원칙', desc:'발송 전 체크리스트', tag:'가이드', href:'...' }
  knowledge: [],
  footer: {},
};

/* ───────────────────────────────────────────────────────────────
   [3] 렌더러 — 아래는 건드릴 필요 없음
   ─────────────────────────────────────────────────────────────── */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 필터 상태 */
const state = { q: '', cat: 'all' };

/* 정렬: 이용 가능(live) 먼저, 준비 중(soon 등) 자동 하단. 그룹 내 순서 유지 */
function ordered() {
  return [...SYSTEM.modules].sort((a, b) =>
    (a.status === 'live' ? 0 : 1) - (b.status === 'live' ? 0 : 1));
}

/* 카테고리별 항목 수 (모듈 + KB) */
function catCounts() {
  const c = {};
  SYSTEM.modules.forEach(m => { c[m.cat] = (c[m.cat] || 0) + 1; });
  (SYSTEM.knowledge || []).forEach(() => { c.kb = (c.kb || 0) + 1; });
  return c;
}
/* 항목이 있는 카테고리만 반환 */
function visibleCats() {
  const c = catCounts();
  return SYSTEM.categories.filter(x => (c[x.key] || 0) > 0);
}
function chipRow() {
  const chips = [{ key: 'all', label: '전체' }, ...visibleCats()];
  return chips.map(x =>
    `<button class="ps-cat ${state.cat === x.key ? 'active' : ''}"
       onclick="setCat('${x.key}')">${esc(x.label)}</button>`).join('');
}
function setCat(key) {
  state.cat = key;
  document.getElementById('ps-cats').innerHTML = chipRow();
  update();
}

function subRow(mi, si) {
  const sb = SYSTEM.modules[mi].subs[si];
  const live = sb.status === 'live' && sb.href;
  const cls = live ? 'is-live' : 'is-soon';
  const attr = live ? `onclick="openSub(${mi},${si});event.stopPropagation();"` : '';
  const tag = live ? '열기' : '준비 중';
  return `
      <div class="ps-sub ${cls}" ${attr}>
        ${svg(sb.icon || 'doc')}
        <span class="ps-sub-txt">
          <span class="ps-sub-title">${esc(sb.title)}</span>
          ${sb.desc ? `<span class="ps-sub-desc">${esc(sb.desc)}</span>` : ''}
        </span>
        <span class="ps-sub-tag">${tag}</span>
      </div>`;
}
function openSub(mi, si) {
  const sb = (SYSTEM.modules[mi].subs || [])[si];
  if (!sb || sb.status !== 'live' || !sb.href) return;
  if (window.innerWidth < 900) closeNav();
  if (sb.external) window.open(sb.href, '_blank', 'noopener'); else location.href = sb.href;
}

function moduleCard(m) {
  const live = m.status === 'live';
  const mi = SYSTEM.modules.indexOf(m);
  const hasSubs = Array.isArray(m.subs) && m.subs.length > 0;
  const clickable = live && m.href && !hasSubs;
  const openAttr = clickable
    ? (m.external
        ? `onclick="window.open('${m.href}','_blank','noopener')"`
        : `onclick="location.href='${m.href}'"`)
    : '';

  const features = `<div class="ps-card-features">${
    m.features.map(esc).join('<span class="sep">·</span>')
  }</div>`;

  const steps = m.steps
    ? `<div class="ps-steps">${m.steps.map(s =>
        `<span class="ps-step ${s}"></span>`).join('')}</div>`
    : '';

  const subs = hasSubs
    ? `<div class="ps-subs">${m.subs.map((_, si) => subRow(mi, si)).join('')}</div>`
    : '';

  const liveSubs = hasSubs ? m.subs.filter(x => x.status === 'live').length : 0;
  const action = hasSubs
    ? `<span class="ps-action disabled">하위 ${m.subs.length}개 · 이용 가능 ${liveSubs}개</span>`
    : (live
        ? `<span class="ps-action">열기 ${svg('arrow')}</span>`
        : `<span class="ps-action disabled">${svg('lock')} 준비 중</span>`);

  return `
    <article class="ps-card ${live ? 'is-live' : 'is-soon'}" ${openAttr}>
      <div class="ps-card-head">
        <span class="ps-card-icon">${svg(m.icon)}</span>
      </div>
      <h3 class="ps-card-title">${esc(m.title)}</h3>
      <p class="ps-card-desc">${esc(m.desc)}</p>
      ${features}
      ${subs}
      ${steps}
      <div class="ps-card-foot">${action}</div>
    </article>`;
}

function kbRow(k) {
  const open = k.href
    ? `onclick="window.open('${k.href}','_blank','noopener')"` : '';
  return `
    <div class="ps-kb-row" ${open}>
      ${svg('doc')}
      <div>
        <div class="ps-kb-title">${esc(k.title)}</div>
        ${k.desc ? `<div class="ps-kb-desc">${esc(k.desc)}</div>` : ''}
      </div>
      ${k.tag ? `<span class="ps-kb-tag">${esc(k.tag)}</span>` : ''}
    </div>`;
}

/* 카테고리 + 검색 필터 → 렌더 */
function update() {
  const query = state.q.trim().toLowerCase();
  const cat = state.cat;
  const label = document.getElementById('ps-label');
  const kbBox = document.getElementById('ps-kb');
  const grid  = document.getElementById('ps-grid');
  const empty = document.getElementById('ps-empty');
  const matchQ = t => !query || t.toLowerCase().includes(query);

  // 모듈: 카테고리 일치(전체거나 같은 cat) + 검색어 일치. 'kb' 선택 시 모듈 없음
  const subText = m => (m.subs || []).map(s => s.title + ' ' + (s.desc || '')).join(' ');
  const mods = (cat === 'kb') ? [] : ordered().filter(m =>
    (cat === 'all' || m.cat === cat) &&
    matchQ(m.title + ' ' + m.desc + ' ' + m.features.join(' ') + ' ' + subText(m)));

  // KB: 'kb' 카테고리이거나, 전체+검색 중일 때 노출
  const kbSource = (cat === 'kb' || (cat === 'all' && query))
    ? (SYSTEM.knowledge || []) : [];
  const kbs = kbSource.filter(k =>
    matchQ(k.title + ' ' + (k.desc || '') + ' ' + (k.tag || '')));

  const catLabel = (SYSTEM.categories.find(c => c.key === cat) || {}).label;
  label.textContent = query ? '검색 결과'
    : (cat === 'all' ? 'AI 모듈' : catLabel);
  kbBox.innerHTML = kbs.map(kbRow).join('');
  grid.innerHTML  = mods.map(moduleCard).join('');
  empty.innerHTML = (mods.length === 0 && kbs.length === 0)
    ? `<div class="ps-empty">${query ? '검색 결과가 없어요.' : '항목이 없어요.'}</div>` : '';
}

/* ── 사이드바 (config에서 렌더) ── */
function sidebarHTML() {
  const s = SYSTEM;
  let h = `<div class="ps-sidebar-head">
      <span class="ps-mark">${svg(s.brand.mark)}</span>
      <span class="ps-sidebar-title">${esc(s.brand.title)}</span>
    </div><nav class="ps-nav">
    <div class="ps-nav-item" onclick="navHome()">${svg('home')}홈</div>`;
  visibleCats().forEach(c => {
    h += `<div class="ps-nav-group">${esc(c.label)}</div>`;
    if (c.key === 'kb') {
      (s.knowledge || []).forEach(k => {
        const open = k.href ? `onclick="window.open('${k.href}','_blank','noopener')"` : '';
        h += `<div class="ps-nav-item" ${open}>${svg('doc')}${esc(k.title)}</div>`;
      });
    } else {
      s.modules.forEach((m, i) => {
        if (m.cat !== c.key) return;
        const hasSubs = Array.isArray(m.subs) && m.subs.length > 0;
        const live = m.status === 'live' && m.href && !hasSubs;
        const attr = live ? `onclick="openModuleNav(${i})"` : '';
        const soon = m.status !== 'live' ? `<span class="soon">예정</span>` : '';
        h += `<div class="ps-nav-item" ${attr}>${svg(m.icon)}${esc(m.title)}${soon}</div>`;
        if (hasSubs) {
          m.subs.forEach((sb, si) => {
            const sLive = sb.status === 'live' && sb.href;
            const sAttr = sLive ? `onclick="openSub(${i},${si})"` : '';
            const sSoon = sLive ? '' : `<span class="soon">예정</span>`;
            h += `<div class="ps-nav-item sub" ${sAttr}>${svg(sb.icon || 'doc')}${esc(sb.title)}${sSoon}</div>`;
          });
        }
      });
    }
  });
  return h + `</nav>`;
}
function openModuleNav(i) {
  const m = SYSTEM.modules[i];
  if (!m || m.status !== 'live' || !m.href) return;
  if (window.innerWidth < 900) closeNav();
  if (m.external) window.open(m.href, '_blank', 'noopener'); else location.href = m.href;
}
function navHome() {
  state.cat = 'all';
  document.getElementById('ps-cats').innerHTML = chipRow();
  update();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (window.innerWidth < 900) closeNav();
}
function setNav(open) {
  document.body.classList.toggle('ps-nav-open', open);
  try { localStorage.setItem('ps_nav', open ? '1' : '0'); } catch (e) {}
}
function toggleNav() { setNav(!document.body.classList.contains('ps-nav-open')); }
function closeNav() { setNav(false); }

function render() {
  const s = SYSTEM;
  const today = new Date().toLocaleDateString('ko-KR',
    { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });

  document.getElementById('app').innerHTML = `
    <aside class="ps-sidebar">${sidebarHTML()}</aside>
    <div class="ps-nav-backdrop" onclick="closeNav()"></div>
    <div class="ps-main-col">
      <header class="ps-topbar">
        <div class="ps-brand">
          <button class="ps-nav-toggle" onclick="toggleNav()" aria-label="메뉴 열기·닫기">${svg('list')}</button>
          <span class="ps-mark">${svg(s.brand.mark)}</span>
          <span class="ps-brand-text">
            <span class="ps-brand-title">${esc(s.brand.title)}</span>
          </span>
        </div>
        <div class="ps-topbar-right">${today}</div>
      </header>

      <section class="ps-hero">
        <form class="ps-search" onsubmit="return false;">
          <span class="ps-search-icon">${svg('search')}</span>
          <input id="ps-q" type="text" autocomplete="off"
            placeholder="${esc(s.search.placeholder)}" aria-label="검색">
        </form>
        <div class="ps-hero-helper">${esc(s.search.helper)}</div>
        <div class="ps-cats" id="ps-cats">${chipRow()}</div>
      </section>

      <main class="ps-section" style="padding-bottom:2.5rem;">
        <div class="ps-section-label" id="ps-label">AI 모듈</div>
        <div class="ps-kb" id="ps-kb"></div>
        <div class="ps-grid" id="ps-grid"></div>
        <div id="ps-empty"></div>
      </main>

      <footer class="ps-footer">
        <span>${esc(s.maker)}</span>
      </footer>
    </div>`;

  const input = document.getElementById('ps-q');
  input.addEventListener('input', e => { state.q = e.target.value; update(); });
  // 사이드바 기본 상태: 데스크톱 열림 / 모바일 닫힘 (사용자 선택은 기억)
  let saved = null; try { saved = localStorage.getItem('ps_nav'); } catch (e) {}
  setNav(saved === null ? window.innerWidth >= 900 : saved === '1');
  update();
}

render();
</script>
</body>
</html>
