<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>백년밥상 AI 시스템</title>
  <meta name="description" content="백년밥상 마케팅 자동화 시스템">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="preset-system.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════
     프리셋 AI 시스템 허브 — 화면 전체가 아래 SYSTEM config로 렌더됩니다.
     신규 클라이언트용으로 복제할 때는 SYSTEM 객체만 교체하세요.
     ══════════════════════════════════════════════════════════════ -->

<div id="app"></div>

<script>
/* ───────────────────────────────────────────────────────────────
   [1] 아이콘 세트 — 얇은 라인 스트로크(단색). 이모지 사용 안 함.
   ─────────────────────────────────────────────────────────────── */
const ICON = {
  bowl:      '<path d="M3 11h18M4 11a8 8 0 0 0 16 0M8 11V7a1 1 0 0 1 1-1M12 11V5M16 11V7a1 1 0 0 0-1-1"/>',
  message:   '<path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>',
  trending:  '<path d="M3 17l6-6 4 4 8-8M21 7v5m0-5h-5"/>',
  activity:  '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  sparkle:   '<path d="M12 3v4m0 10v4M5 12H1m22 0h-4M6.3 6.3 4 4m16 16-2.3-2.3M6.3 17.7 4 20M20 4l-2.3 2.3"/><circle cx="12" cy="12" r="3.2"/>',
  arrow:     '<path d="M5 12h14M13 6l6 6-6 6"/>',
  lock:      '<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  search:    '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  doc:       '<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 3h9l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>',
};
function svg(name, cls) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
    ${cls ? `class="${cls}"` : ''}>${ICON[name] || ''}</svg>`;
}

/* ───────────────────────────────────────────────────────────────
   [2] SYSTEM CONFIG — 이 블록만 클라이언트에 맞게 교체
       · brand.title : 시스템 이름
       · maker       : 제작사 표기 (아주 작게)
       · modules     : 상태 'live'가 자동으로 위로, 'soon'은 자동 하단
       · knowledge   : 검색되는 자료(KB) 목록. 채우면 검색창에 노출됨
   ─────────────────────────────────────────────────────────────── */
const SYSTEM = {
  brand: {
    mark: 'bowl',
    title: '백년밥상 AI 시스템',
  },
  maker: 'Created by FRISAT',
  search: {
    placeholder: '모듈이나 자료 검색',
    helper: '필요한 모듈이나 자료를 검색해 보세요.',
  },
  // 카테고리 필터 — 항목(모듈/KB)이 1개 이상 있는 카테고리만 칩으로 노출됨.
  // 순서·라벨은 여기서 조정. KB는 knowledge 배열이 채워지면 자동 표시.
  categories: [
    { key: 'dashboard',   label: '대시보드' },
    { key: 'performance', label: '퍼포먼스' },
    { key: 'content',     label: '콘텐츠' },
    { key: 'admin',       label: '어드민' },
    { key: 'kb',          label: 'KB' },
  ],
  modules: [
    {
      icon: 'message',
      title: 'CRM 자동화 OS',
      cat: 'admin',
      desc: '상품 선정부터 카카오톡 발송까지 주간 CRM 파이프라인을 관리해요. 날씨·트렌드 기반으로 발송 상품을 추천합니다.',
      features: ['날씨 소구 추천', '트렌드 서치', '우선순위 분석', '메시지 생성'],
      status: 'live',
      href: 'crm-os.html',
      steps: ['done', 'active', '', '', '', '', ''],
    },
    {
      icon: 'trending',
      title: 'ROI 시뮬레이션',
      cat: 'dashboard',
      desc: '광고비 대비 예상 매출과 ROAS, 손익을 시뮬레이션해요. 채널별 예산 배분안도 함께 제안합니다.',
      features: ['ROAS 예측', '예산 최적화', '손익 시뮬레이션', '목표 역산'],
      status: 'soon',
    },
    {
      icon: 'activity',
      title: '퍼포먼스 대시보드',
      cat: 'performance',
      desc: '주차별 매출과 ROAS 추이, 채널·캠페인 성과를 한눈에 봅니다. 주간 인사이트도 매주 업데이트돼요.',
      features: ['주차별 ROAS', '채널별 매출', '캠페인 상세', '주간 인사이트'],
      status: 'live',
      href: 'https://hayley-create.github.io/100bs/',
      external: true,
    },
    {
      icon: 'sparkle',
      title: '콘텐츠 인사이트',
      cat: 'content',
      desc: '소재별 성과를 분석해 전환을 만드는 비주얼과 카피를 찾습니다. 다음 소재 방향도 제안해요.',
      features: ['소재 성과 분석', '카피 패턴', '크리에이티브 제안', 'A/B 인사이트'],
      status: 'soon',
    },
  ],
  // 검색되는 자료(KB). 채우면 KB 카테고리 칩과 검색 결과에 자동 노출됨.
  // 예: { title:'CRM 게이트 원칙', desc:'발송 전 체크리스트', tag:'가이드', href:'...' }
  knowledge: [],
  footer: {},
};

/* ───────────────────────────────────────────────────────────────
   [3] 렌더러 — 아래는 건드릴 필요 없음
   ─────────────────────────────────────────────────────────────── */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 필터 상태 */
const state = { q: '', cat: 'all' };

/* 정렬: 이용 가능(live) 먼저, 준비 중(soon 등) 자동 하단. 그룹 내 순서 유지 */
function ordered() {
  return [...SYSTEM.modules].sort((a, b) =>
    (a.status === 'live' ? 0 : 1) - (b.status === 'live' ? 0 : 1));
}

/* 카테고리별 항목 수 (모듈 + KB) */
function catCounts() {
  const c = {};
  SYSTEM.modules.forEach(m => { c[m.cat] = (c[m.cat] || 0) + 1; });
  (SYSTEM.knowledge || []).forEach(() => { c.kb = (c.kb || 0) + 1; });
  return c;
}
/* 항목이 있는 카테고리만 반환 */
function visibleCats() {
  const c = catCounts();
  return SYSTEM.categories.filter(x => (c[x.key] || 0) > 0);
}
function chipRow() {
  const chips = [{ key: 'all', label: '전체' }, ...visibleCats()];
  return chips.map(x =>
    `<button class="ps-cat ${state.cat === x.key ? 'active' : ''}"
       onclick="setCat('${x.key}')">${esc(x.label)}</button>`).join('');
}
function setCat(key) {
  state.cat = key;
  document.getElementById('ps-cats').innerHTML = chipRow();
  update();
}

function moduleCard(m) {
  const live = m.status === 'live';
  const clickable = live && m.href;
  const openAttr = clickable
    ? (m.external
        ? `onclick="window.open('${m.href}','_blank','noopener')"`
        : `onclick="location.href='${m.href}'"`)
    : '';

  const features = `<div class="ps-card-features">${
    m.features.map(esc).join('<span class="sep">·</span>')
  }</div>`;

  const steps = m.steps
    ? `<div class="ps-steps">${m.steps.map(s =>
        `<span class="ps-step ${s}"></span>`).join('')}</div>`
    : '';

  const action = live
    ? `<span class="ps-action">열기 ${svg('arrow')}</span>`
    : `<span class="ps-action disabled">${svg('lock')} 준비 중</span>`;

  return `
    <article class="ps-card ${live ? 'is-live' : 'is-soon'}" ${openAttr}>
      <div class="ps-card-head">
        <span class="ps-card-icon">${svg(m.icon)}</span>
      </div>
      <h3 class="ps-card-title">${esc(m.title)}</h3>
      <p class="ps-card-desc">${esc(m.desc)}</p>
      ${features}
      ${steps}
      <div class="ps-card-foot">${action}</div>
    </article>`;
}

function kbRow(k) {
  const open = k.href
    ? `onclick="window.open('${k.href}','_blank','noopener')"` : '';
  return `
    <div class="ps-kb-row" ${open}>
      ${svg('doc')}
      <div>
        <div class="ps-kb-title">${esc(k.title)}</div>
        ${k.desc ? `<div class="ps-kb-desc">${esc(k.desc)}</div>` : ''}
      </div>
      ${k.tag ? `<span class="ps-kb-tag">${esc(k.tag)}</span>` : ''}
    </div>`;
}

/* 카테고리 + 검색 필터 → 렌더 */
function update() {
  const query = state.q.trim().toLowerCase();
  const cat = state.cat;
  const label = document.getElementById('ps-label');
  const kbBox = document.getElementById('ps-kb');
  const grid  = document.getElementById('ps-grid');
  const empty = document.getElementById('ps-empty');
  const matchQ = t => !query || t.toLowerCase().includes(query);

  // 모듈: 카테고리 일치(전체거나 같은 cat) + 검색어 일치. 'kb' 선택 시 모듈 없음
  const mods = (cat === 'kb') ? [] : ordered().filter(m =>
    (cat === 'all' || m.cat === cat) &&
    matchQ(m.title + ' ' + m.desc + ' ' + m.features.join(' ')));

  // KB: 'kb' 카테고리이거나, 전체+검색 중일 때 노출
  const kbSource = (cat === 'kb' || (cat === 'all' && query))
    ? (SYSTEM.knowledge || []) : [];
  const kbs = kbSource.filter(k =>
    matchQ(k.title + ' ' + (k.desc || '') + ' ' + (k.tag || '')));

  const catLabel = (SYSTEM.categories.find(c => c.key === cat) || {}).label;
  label.textContent = query ? '검색 결과'
    : (cat === 'all' ? 'AI 모듈' : catLabel);
  kbBox.innerHTML = kbs.map(kbRow).join('');
  grid.innerHTML  = mods.map(moduleCard).join('');
  empty.innerHTML = (mods.length === 0 && kbs.length === 0)
    ? `<div class="ps-empty">${query ? '검색 결과가 없어요.' : '항목이 없어요.'}</div>` : '';
}

function render() {
  const s = SYSTEM;
  const today = new Date().toLocaleDateString('ko-KR',
    { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });

  document.getElementById('app').innerHTML = `
    <header class="ps-topbar">
      <div class="ps-brand">
        <span class="ps-mark">${svg(s.brand.mark)}</span>
        <span class="ps-brand-text">
          <span class="ps-brand-title">${esc(s.brand.title)}</span>
        </span>
      </div>
      <div class="ps-topbar-right">${today}</div>
    </header>

    <section class="ps-hero">
      <form class="ps-search" onsubmit="return false;">
        <span class="ps-search-icon">${svg('search')}</span>
        <input id="ps-q" type="text" autocomplete="off"
          placeholder="${esc(s.search.placeholder)}" aria-label="검색">
      </form>
      <div class="ps-hero-helper">${esc(s.search.helper)}</div>
      <div class="ps-cats" id="ps-cats">${chipRow()}</div>
    </section>

    <main class="ps-section" style="padding-bottom:2.5rem;">
      <div class="ps-section-label" id="ps-label">AI 모듈</div>
      <div class="ps-kb" id="ps-kb"></div>
      <div class="ps-grid" id="ps-grid"></div>
      <div id="ps-empty"></div>
    </main>

    <footer class="ps-footer">
      <span>${esc(s.maker)}</span>
    </footer>`;

  const input = document.getElementById('ps-q');
  input.addEventListener('input', e => { state.q = e.target.value; update(); });
  update();
}

render();
</script>
</body>
</html>
